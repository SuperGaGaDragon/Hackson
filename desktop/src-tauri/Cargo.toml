[package]
name = "hackson-desktop-pet"
version = "0.8.4"
description = "Hackson Desktop Pet"
authors = ["Codex"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
reqwest = { version = "0.12.24", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
open = "5.3.3"
tauri = { version = "2.11.0", features = ["macos-private-api"] }
